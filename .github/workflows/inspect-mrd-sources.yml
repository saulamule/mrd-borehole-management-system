name: Inspect Approved MRD Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mrd-sources.yml'
      - 'scripts/inspect_mrd_sources.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          project_id: ${{vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/drive.readonly
            https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Inspect approved source layouts
        env:
          GOOGLE_ACCESS_TOKEN: ${{steps.auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: ${{vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/inspect_mrd_sources.py
