name: Discover MRD Google Sheets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-sheets-discovery.yml'
      - 'scripts/discover_google_sheets.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrd-google-sheets-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud using Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/drive.readonly
            https://www.googleapis.com/auth/spreadsheets.readonly
          access_token_lifetime: 1800s
          create_credentials_file: false

      - name: Install Excel workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Inspect spreadsheet names, worksheet names, and headers
        env:
          GOOGLE_ACCESS_TOKEN: ${{steps.auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: ${{vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/discover_google_sheets.py
