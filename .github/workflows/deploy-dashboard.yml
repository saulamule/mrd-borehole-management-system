name: Build and Deploy MRD Borehole Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'data/boreholes.csv'
      - 'data/purchasing_materials.json'
      - 'dashboard_template.html'
      - 'generate_dashboard.py'
      - 'validate_data.py'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate master register
        run: python validate_data.py
      - name: Generate dashboard
        run: python generate_dashboard.py
      - name: Upload Pages artifact
        if: vars.MRD_DASHBOARD_PUBLIC_RELEASE_APPROVED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' && vars.MRD_DASHBOARD_PUBLIC_RELEASE_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# The MRD dashboard workflow is the sole Pages publisher.
