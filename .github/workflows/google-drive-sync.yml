name: Sync MRD Dashboard from Google Drive
# MRD-approved public release is controlled by repository variable MRD_DASHBOARD_PUBLIC_RELEASE_APPROVED.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_google_sources.py'
      - 'generate_dashboard.py'
      - 'dashboard_template.html'
      - 'gis_layers/**'
      - '.github/workflows/google-drive-sync.yml'

permissions:
  contents: read

concurrency:
  group: mrd-google-drive-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate to Google Cloud using Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: |
            https://www.googleapis.com/auth/drive.readonly
            https://www.googleapis.com/auth/spreadsheets.readonly
          access_token_lifetime: 1800s
          create_credentials_file: false

      - name: Install Excel workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Read selected Google Drive sources into temporary workspace
        env:
          GOOGLE_ACCESS_TOKEN: ${{steps.auth.outputs.access_token }}
          GOOGLE_DRIVE_FOLDER_ID: ${{vars.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/sync_google_sources.py

      - name: Validate synced borehole register
        run: python validate_data.py

      - name: Generate dashboard
        run: python generate_dashboard.py

      - name: Check generated dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("docs/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.DOTALL)
          if not scripts:
              raise SystemExit("No inline dashboard JavaScript found.")
          Path("/tmp/mrd-dashboard.js").write_text(scripts[-1], encoding="utf-8")
          if "__RESOURCES_DATA_JSON__" in html or "__DATA_JSON__" in html:
              raise SystemExit("A dashboard data placeholder was not replaced.")
          PY
          node --check /tmp/mrd-dashboard.js

      - name: Publish approval status
        run: |
          if [ "$APPROVED" = "true" ]; then
            echo "MRD public-release approval is enabled. Pages artifact will be prepared."
          else
            echo "Public release is not approved. Sources were synced and dashboard built in the temporary runner only; nothing will be published."
          fi
        env:
          APPROVED: ${{vars.MRD_DASHBOARD_PUBLIC_RELEASE_APPROVED }}

      - name: Upload Pages artifact
        if: vars.MRD_DASHBOARD_PUBLIC_RELEASE_APPROVED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: vars.MRD_DASHBOARD_PUBLIC_RELEASE_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
